<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ananya</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --wa: #0b141a;
      --wa-head: #202c33;
      --wa-out: #005c4b;
      --lcd: #8faa7a;
      --lcd-ink: #15240f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: #d6d6d6;
      font: 14px/1.4 "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px 22px 0;
      max-width: 1080px;
      margin: 0 auto;
    }
    header b { font-size: 15px; font-weight: 650; color: #fff; letter-spacing: 0.02em; }
    header span { font-variant-numeric: tabular-nums; color: #7a7a7a; font-size: 12px; }
    .desk {
      max-width: 1080px;
      margin: 0 auto;
      padding: 18px 18px 64px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 820px) { .desk { grid-template-columns: 1fr; justify-items: center; } }

    .handset {
      width: 300px;
      background: linear-gradient(180deg, #3e3e40, #1a1a1c 38%, #141416);
      border-radius: 28px 28px 34px 34px;
      padding: 16px 18px 20px;
      box-shadow:
        inset 0 1px 0 #6a6a6e,
        0 18px 40px rgba(0,0,0,.55);
    }
    .ear {
      display: flex;
      justify-content: center;
      gap: 3px;
      margin: 4px 0 12px;
    }
    .ear i {
      width: 4px; height: 4px; border-radius: 50%;
      background: #0c0c0c; box-shadow: inset 0 1px 0 #555;
    }
    .lcd {
      background: radial-gradient(120% 80% at 50% 0%, #b7cc9a, var(--lcd));
      color: var(--lcd-ink);
      border-radius: 6px;
      min-height: 148px;
      padding: 8px 10px 10px;
      font-family: "Lucida Console", Monaco, "Courier New", monospace;
      box-shadow: inset 0 0 0 2px #0d0d0d, inset 0 8px 16px rgba(0,0,0,.12);
      position: relative;
    }
    .lcd-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.08em;
    }
    .bars { letter-spacing: -1px; }
    .lcd-state { font-size: 11px; margin-top: 10px; letter-spacing: 0.12em; }
    .lcd-num {
      font-size: 18px;
      margin-top: 4px;
      word-break: break-all;
      min-height: 1.3em;
    }
    .lcd-sub { font-size: 11px; margin-top: 8px; opacity: .75; }
    .lcd.ring .lcd-state { animation: flash 0.7s steps(2) infinite; }
    @keyframes flash { 50% { opacity: 0; } }
    .heat {
      position: absolute; right: 8px; bottom: 8px;
      display: flex; gap: 4px;
    }
    .heat b {
      width: 7px; height: 7px; border-radius: 50%;
      background: #2a3a22; display: block;
    }
    .heat.hot .h { background: #c81e1e; }
    .heat.warm .w { background: #c45c10; }
    .heat.cold .c { background: #2a5a9a; }

    .nav {
      display: flex; justify-content: space-between; align-items: center;
      margin: 10px 6px;
    }
    .soft { color: #bbb; font-size: 11px; }
    .oval {
      width: 54px; height: 22px; border-radius: 11px;
      background: #2a2a2c; box-shadow: inset 0 1px 0 #555, 0 1px 0 #000;
    }
    .callrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0 4px 10px; }
    .key {
      background: #2c2c2e;
      color: #eee;
      border: 0;
      border-radius: 6px;
      padding: 8px 0 6px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 #5a5a5e, 0 1px 0 #000;
      font-family: inherit;
    }
    .key:active { transform: translateY(1px); background: #232325; }
    .key small { display: block; color: #888; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; }
    .key.num { font-size: 18px; font-weight: 600; }
    .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .go { background: #1f7a3a; color: #fff; font-weight: 700; }
    .stop { background: #7a1f1f; color: #fff; font-weight: 700; }
    .log {
      margin-top: 10px;
      font-size: 11px;
      color: #8a8a8a;
      font-variant-numeric: tabular-nums;
    }
    .log div { display: flex; justify-content: space-between; gap: 8px; padding: 3px 2px; cursor: pointer; }
    .log div:hover { color: #ddd; }
    .msg { min-height: 16px; margin: 8px 4px 0; font-size: 12px; color: #9a9a9a; }

    .phone {
      width: 100%;
      max-width: 520px;
      background: var(--wa);
      border-radius: 12px;
      overflow: hidden;
      min-height: 560px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 18px 40px rgba(0,0,0,.45);
      border: 1px solid #1a242c;
    }
    .wa-head {
      background: var(--wa-head);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ava {
      width: 36px; height: 36px; border-radius: 50%;
      background: #2a3942; color: #dfe5e7;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
    }
    .wa-head strong { display: block; color: #e9edef; font-size: 15px; }
    .wa-head em { font-style: normal; color: #8696a0; font-size: 12px; }
    .chat {
      flex: 1;
      padding: 14px 12px 18px;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.03), transparent 40%),
        var(--wa);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .day {
      align-self: center;
      background: #182229;
      color: #8696a0;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .bubble {
      align-self: flex-end;
      max-width: 86%;
      background: var(--wa-out);
      color: #e9edef;
      padding: 7px 9px 5px;
      border-radius: 8px 8px 2px 8px;
      white-space: pre-wrap;
      font-size: 13.5px;
      line-height: 1.45;
    }
    .bubble time {
      display: block;
      text-align: right;
      font-size: 10px;
      color: #a8c5bc;
      margin-top: 4px;
    }
    .vcard, .att {
      align-self: flex-end;
      max-width: 86%;
      background: var(--wa-out);
      border-radius: 8px;
      padding: 8px;
      color: #e9edef;
      font-size: 13px;
    }
    .vcard b { display: block; }
    .vcard span, .att span { color: #a8c5bc; font-size: 12px; }
    .ghost-chat {
      color: #667781;
      font-size: 13px;
      text-align: center;
      margin: auto 24px;
      line-height: 1.5;
    }
    .qrbox {
      margin: auto;
      text-align: center;
      color: #8696a0;
      font-size: 13px;
    }
    .qrbox img {
      width: 196px; height: 196px;
      background: #fff; padding: 8px;
      border-radius: 8px;
      display: block;
      margin: 0 auto 10px;
    }
  </style>
</head>
<body>
  <header>
    <b>Ananya</b>
    <span id="ist"></span>
  </header>
  <div class="desk">
    <div>
      <div class="handset">
        <div class="ear"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="lcd" id="lcd">
          <div class="lcd-top"><span class="bars" id="bars">ANANYA ▂▄▆█</span><span id="lcdClock"></span></div>
          <div class="lcd-state" id="lcdState">READY</div>
          <div class="lcd-num" id="lcdNum"></div>
          <div class="lcd-sub" id="lcdSub"></div>
          <div class="heat" id="heat"><b class="h"></b><b class="w"></b><b class="c"></b></div>
        </div>
        <div class="nav"><span class="soft" id="leftSoft">Me</span><div class="oval"></div><span class="soft">Hire</span></div>
        <div class="callrow">
          <button class="key go" id="callGo">Call</button>
          <button class="key stop" id="callLead">86886 64337</button>
        </div>
        <div class="pad" id="pad"></div>
        <div class="msg" id="callStatus"></div>
      </div>
      <div class="log" id="log"></div>
    </div>
    <section class="phone">
      <div class="wa-head">
        <div class="ava">A</div>
        <div>
          <strong>Ananya</strong>
          <em id="waSub">linking…</em>
        </div>
      </div>
      <div class="chat" id="chat"></div>
    </section>
  </div>
  <script>
    const KEYS = [
      ["1", ""], ["2", "abc"], ["3", "def"],
      ["4", "ghi"], ["5", "jkl"], ["6", "mno"],
      ["7", "pqrs"], ["8", "tuv"], ["9", "wxyz"],
      ["⌫", ""], ["0", "+"], ["#", ""],
    ];
    const pad = document.getElementById("pad");
    KEYS.forEach(([n, l]) => {
      const b = document.createElement("button");
      b.className = "key num";
      b.innerHTML = n + (l ? "<small>" + l + "</small>" : "");
      b.onclick = () => tap(n);
      pad.appendChild(b);
    });

    let typed = "";
    let lead = "";
    let me = "";
    let last = null;

    function digits(n) { return String(n || "").replace(/\D/g, ""); }
    function pretty(n) {
      const d = digits(n);
      if (d.startsWith("91") && d.length === 12) return "+91 " + d.slice(2, 7) + " " + d.slice(7);
      if (d.length === 10) return d.slice(0, 5) + " " + d.slice(5);
      return n || "";
    }
    function istNow() {
      return new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit", hour12: true, weekday: "short" });
    }
    function hhmm(iso) {
      if (!iso) return "";
      return new Date(iso).toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "numeric", minute: "2-digit", hour12: true });
    }
    function elapsed(iso) {
      const s = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }
    function tap(n) {
      if (n === "⌫") typed = typed.slice(0, -1);
      else if (n === "#") typed = "";
      else typed += n;
      drawLcd(last);
    }
    function onScreen() {
      return typed || lead;
    }

    function drawLcd(s) {
      const live = s?.latest && (s.latest.status === "dialing" || s.latest.status === "in_progress");
      const lcd = document.getElementById("lcd");
      lcd.className = "lcd" + (s?.latest?.status === "dialing" ? " ring" : "");
      document.getElementById("lcdClock").textContent = new Date().toLocaleTimeString("en-IN", { timeZone: "Asia/Kolkata", hour: "2-digit", minute: "2-digit", hour12: false });
      let state = "READY";
      if (s?.latest?.status === "dialing") state = "CALLING";
      else if (s?.latest?.status === "in_progress") state = "CONNECTED";
      else if (s?.latest?.status === "failed") state = "NO ANSWER";
      else if (s?.latest?.status === "completed") state = "ENDED";
      document.getElementById("lcdState").textContent = state;
      document.getElementById("lcdNum").textContent = pretty(typed || (live ? s.latest.to : lead));
      const heat = s?.slip?.heat || s?.latest?.classification;
      document.getElementById("heat").className = "heat" + (heat ? " " + heat : "");
      const bits = [];
      if (live && s.latest.createdAt) bits.push(elapsed(s.latest.createdAt));
      if (s?.slip?.lang) bits.push(s.slip.lang);
      if (s?.slip?.sells) bits.push(s.slip.sells);
      document.getElementById("lcdSub").textContent = bits.join("  ·  ");
    }

    function drawChat(s) {
      const chat = document.getElementById("chat");
      const ready = s.whatsapp.status === "ready";
      document.getElementById("waSub").textContent = ready
        ? (s.latest && (s.latest.status === "dialing" || s.latest.status === "in_progress") ? "on this call" : "online")
        : s.whatsapp.status === "qr" ? "scan to link" : s.whatsapp.status;
      if (!ready) {
        chat.innerHTML = '<div class="qrbox"><img id="qr" alt="QR" /><div>WhatsApp → Linked devices.<br>Mid-call messages wait on this.</div></div>';
        if (s.whatsapp.qr) chat.querySelector("#qr").src = s.whatsapp.qr;
        return;
      }
      if (!s.packet) {
        chat.innerHTML = '<div class="ghost-chat">Nothing on this chat yet.<br>When they ask for details mid-call, the same text lands here and on their phone.</div>';
        return;
      }
      const sent = s.packet.sent;
      chat.innerHTML = "";
      const day = document.createElement("div");
      day.className = "day";
      day.textContent = sent ? "sent during the call" : "queued — not sent";
      chat.appendChild(day);
      const bub = document.createElement("div");
      bub.className = "bubble";
      bub.textContent = s.packet.text;
      const tm = document.createElement("time");
      tm.textContent = hhmm(s.latest?.whatsappMidSentAt || s.latest?.whatsappFollowupSentAt || s.latest?.updatedAt) + (sent ? " ✓✓" : "");
      bub.appendChild(tm);
      chat.appendChild(bub);
      const card = document.createElement("div");
      card.className = "vcard";
      card.innerHTML = "<b></b><span>Contact</span>";
      card.querySelector("b").textContent = (s.candidateName || "Saksham Bansal") + "  " + pretty(s.candidate);
      chat.appendChild(card);
      if (sent) {
        const a = document.createElement("div");
        a.className = "att";
        a.innerHTML = "<b>Saksham_Bansal_Resume.pdf</b><span>PDF</span>";
        chat.appendChild(a);
      }
    }

    async function refresh() {
      const s = await fetch("/api/status").then((r) => r.json());
      last = s;
      lead = s.lead;
      me = s.candidate;
      if (!typed) document.getElementById("lcdNum").textContent = pretty(lead);
      drawLcd(s);
      drawChat(s);
      document.getElementById("bars").textContent = (s.omnidim ? "ANANYA ▂▄▆█" : "ANANYA ▂▄");
      const log = document.getElementById("log");
      log.innerHTML = (s.recent || []).map((c) => {
        return "<div data-to=\"" + c.to + "\"><span>" + pretty(c.to) + "</span><span>" + (c.classification || c.status) + (c.wa ? "  wa" : "") + "</span></div>";
      }).join("");
      log.querySelectorAll("div").forEach((el) => {
        el.onclick = () => { typed = digits(el.getAttribute("data-to")).replace(/^91/, ""); drawLcd(last); };
      });
      if (s.whatsapp.error) document.getElementById("callStatus").textContent = s.whatsapp.error;
    }

    async function call(payload) {
      document.getElementById("callStatus").textContent = "calling…";
      const res = await fetch("/api/call", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
      const data = await res.json();
      document.getElementById("callStatus").textContent = data.ok ? "" : (data.error || "failed");
      typed = "";
      refresh();
    }

    document.getElementById("callGo").onclick = () => {
      const n = typed || lead;
      if (digits(n) === digits(me)) call({ test: true });
      else if (!typed || digits(n) === digits(lead)) call({});
      else call({ to: n });
    };
    document.getElementById("callLead").onclick = () => { typed = ""; call({}); };
    document.getElementById("leftSoft").onclick = () => { typed = digits(me).slice(-10); drawLcd(last); };
    document.querySelector(".nav .soft:last-child").onclick = () => { typed = ""; call({}); };

    function tick() {
      document.getElementById("ist").textContent = istNow() + " IST";
      if (last) drawLcd(last);
    }
    tick();
    setInterval(tick, 1000);
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
